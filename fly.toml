# fly.toml app configuration file generated for prism-api-dry-morning-9815 on 2026-04-12T00:26:39+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'prism-api-dry-morning-9815'
primary_region = 'nrt'

[build]

[env]
  LOG_LEVEL = 'info'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
