# Fly.io configuration for prism-api.
#
# Update `app` to match the Fly.io application name after `fly launch` or
# `fly apps create`. `nrt` (Tokyo) is the default primary region; change it
# to the region closest to your users if desired.
app = "prism-api"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
